[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-platform-stagewhisper"
version = "0.43.0"
description = "StageWhisper platform adapter for Hermes Agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "segno>=1.6",
    "PyYAML>=6.0",
]

[project.scripts]
stagewhisper-hermes = "hermes_stagewhisper_plugin.cli:main"
stagewhisper-hermes-install = "hermes_stagewhisper_plugin.install:main"

[tool.setuptools.packages.find]
include = ["hermes_stagewhisper_plugin*"]

[tool.setuptools.package-data]
hermes_stagewhisper_plugin = [
    "plugin.yaml",
    "templates/*",
    "ops/*.sh",
    "ops/*.template",
    "ops/lib/*.sh",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
